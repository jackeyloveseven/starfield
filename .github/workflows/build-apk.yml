name: Build Android APK

on:
  push:
    paths:
      - 'starfield.html'
      - 'version.json'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Download & Setup Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Sync Web Assets to Android Project
        run: |
          mkdir -p android/app/src/main/assets
          cp starfield.html android/app/src/main/assets/starfield.html
          cp manifest.json android/app/src/main/assets/manifest.json
          cp service-worker.js android/app/src/main/assets/service-worker.js
          cp icon-192.png android/app/src/main/assets/icon-192.png
          cp icon-512.png android/app/src/main/assets/icon-512.png
          cp version.json android/app/src/main/assets/version.json
          # The page loads ./libs/three.min.js and links ./planet_studio.html.
          # Without these the APK fell back to the CDN (or broke offline), and an
          # OTA'd copy in filesDir could not resolve them at all.
          cp -r libs android/app/src/main/assets/libs
          cp planet_studio.html android/app/src/main/assets/planet_studio.html

      - name: Build Debug APK
        working-directory: ./android
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Rename Output APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk StarfieldFocus.apk

      - name: Extract Version Info
        id: get_version
        run: |
          VERSION_NAME=$(grep 'versionName' android/app/build.gradle | awk -F'"' '{print $2}')
          VERSION_CODE=$(grep 'versionCode' android/app/build.gradle | awk '{print $2}')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarfieldFocus-APK
          path: StarfieldFocus.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: "v${{ steps.get_version.outputs.version_name }}-focus-apk"
          name: "星空 · Android v${{ steps.get_version.outputs.version_name }} (Build ${{ steps.get_version.outputs.version_code }})"
          body: |
            ### 🌌 星空 · STARFIELD // 挂机深空探索与专注番茄钟 Android 安装包 (APK)
            
            - **版本**：v${{ steps.get_version.outputs.version_name }} (Build ${{ steps.get_version.outputs.version_code }})
            - **视觉与动效革新**：基于 `page-design` 与 `design-to-motion` 体系重构，深空雷达信标波纹、星球呼吸光晕与光幕掠扫主按键；
            - **2K Ultra 视网膜引擎**：移动端最高 2.75x DPR 点对点真视网膜级锐度；
            - **120Hz/144Hz 满血高刷**：彻底解锁移动设备硬件刷新率上限，附带智能巡航节能温控；
            - **单文件零依赖核心**：Vanilla JS + WebGL + Canvas2D + Web Audio 物理合成；
            - **原生触控优化**：人体工学左手隐形浮动摇杆 + 右手扇形动作簇。
          files: StarfieldFocus.apk
