name: Build Android APK

on:
  push:
    paths:
      - 'starfield.html'
      - 'version.json'
      - 'android/**'
      - 'godot/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Download & Setup Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Sync Web Assets to Android Project
        run: |
          mkdir -p android/app/src/main/assets
          cp starfield.html android/app/src/main/assets/starfield.html
          cp manifest.json android/app/src/main/assets/manifest.json
          cp service-worker.js android/app/src/main/assets/service-worker.js
          cp icon-192.png android/app/src/main/assets/icon-192.png
          cp icon-512.png android/app/src/main/assets/icon-512.png
          cp version.json android/app/src/main/assets/version.json
          # The page loads ./libs/three.min.js and links ./planet_studio.html.
          # Without these the APK fell back to the CDN (or broke offline), and an
          # OTA'd copy in filesDir could not resolve them at all.
          cp -r libs android/app/src/main/assets/libs
          cp planet_studio.html android/app/src/main/assets/planet_studio.html

      - name: Build Debug APK
        working-directory: ./android
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Rename Output APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk StarfieldFocus.apk

      - name: Extract Version Info
        id: get_version
        run: |
          VERSION_NAME=$(grep 'versionName' android/app/build.gradle | awk -F'"' '{print $2}')
          VERSION_CODE=$(grep 'versionCode' android/app/build.gradle | awk '{print $2}')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarfieldFocus-APK
          path: StarfieldFocus.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: "v${{ steps.get_version.outputs.version_name }}-focus-apk"
          name: "星空 · Android & Native v${{ steps.get_version.outputs.version_name }} (Build ${{ steps.get_version.outputs.version_code }})"
          body: |
            ### 🌌 星空 · STARFIELD // 机制美学重构与玩法跃迁发布

            - **版本**：v${{ steps.get_version.outputs.version_name }} (Build ${{ steps.get_version.outputs.version_code }})
            - **宇宙超新星抽卡点火典礼**：多阶段开箱点火仪式（奇点引力坍缩、90 颗螺旋粒子、Shepard 嗡鸣、超新星冲击波与 3D 卡牌解离浮现）；
            - **奢华天象星图塔罗卡牌与 3D 程序化球体**：9:15 比例天象塔罗、金色星盘双线花丝雕花、全息色散光箔，搭载 360° 自由拖拽自转的程序化星球（Procedural Planet Sphere）；
            - **旗舰随行护航轨道系统 (Escort Orbits)**：已发现行星一键编入旗舰护航编队（最多 3 颗），提供偏心引力轨道、微缩天体流光残影与星尘磁场牵引加成；
            - **主动巡天测绘声呐 (Active Deep-Space Sonar)**：前向引力感知阵列实时锁定目标，按 [F] 触发高科技声呐波扫描，奖励星尘与捕获深空星核；
            - **番茄钟专注逻辑深度解耦**：移除强插 DOM 的 MutationObserver，专注完成自然结算奖励未开采星核，并提供优雅的天象馆跳转；
            - **移动端纯净无框 HUD**：全屏无框纯净 HUD，轨迹曲线无遮挡舒展，消除所有层叠方框与刘海遮挡；
            - **跨端可执行包**：包含 Android 安装包 (`StarfieldFocus.apk`) 与 Godot 原生 PC 游戏包 (`StarfieldNative.pck`)。
          files: |
            StarfieldFocus.apk
            godot/builds/StarfieldNative.pck
