name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Only the site is published: the repository also holds the build
      # toolchain and the shots, none of which belong on a web host. index.html
      # is the starfield piece, so the root URL opens it directly.
      - name: Stage site
        run: |
          mkdir -p _site
          cp starfield.html _site/index.html
          cp starfield.html _site/starfield.html
          cp migration.html _site/migration.html
          cp CREDITS.md _site/CREDITS.md
          cp README.md _site/README.md
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
